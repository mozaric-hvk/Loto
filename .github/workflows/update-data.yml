name: Mise à jour automatique des tirages Loto

on:
  schedule:
    # S'exécute automatiquement du lundi au samedi à 22h30 UTC
    - cron: '30 22 * * 1,3,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Télécharger le CSV du Loto
        run: |
          python -c "
          import urllib.request

          url = 'https://www.statistiques-loto.fr/csv/loto_201911.csv'
          req = urllib.request.Request(
              url, 
              headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}
          )

          try:
              with urllib.request.urlopen(req) as response, open('loto.csv', 'wb') as out_file:
                  out_file.write(response.read())
              print('Téléchargement réussi !')
          except Exception as e:
              print(f'Erreur : {e}')
              # Secours via un proxy dédié si le domaine bloque
              fallback_url = 'https://api.allorigins.win/raw?url=https://www.statistiques-loto.fr/csv/loto_201911.csv'
              req_fallback = urllib.request.Request(fallback_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req_fallback) as response, open('loto.csv', 'wb') as out_file:
                  out_file.write(response.read())
              print('Téléchargement via secours réussi !')
          "

      - name: Sauvegarder les modifications
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add loto.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour auto du fichier loto.csv" && git push)
