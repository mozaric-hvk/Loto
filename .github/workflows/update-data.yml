name: Update Loto Data

on:
  schedule:
    - cron: '0 23 * * 1,3,6'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas requests

      - name: Download via FDJ API & Process CSV
        run: |
          python3 -c "
          import requests, zipfile, io, glob
          import pandas as pd

          # URL de l'API de téléchargement FDJ
          api_url = 'https://www.sto.api.fdj.fr/anonymous/service-draw-info/v3/documentations/1a2b3c4d-9876-4562-b3fc-2c963f66afp6'
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
              'Accept-Language': 'fr-FR,fr;q=0.9',
              'Referer': 'https://www.fdj.fr/'
          }

          session = requests.Session()
          print('Téléchargement du ZIP depuis l\'API STO FDJ...')
          
          # allow_redirects=True permet de suivre la redirection vers le fichier ZIP réel
          r = session.get(api_url, headers=headers, allow_redirects=True, timeout=30)
          
          if r.status_code != 200:
              raise ValueError(f'Erreur de téléchargement API (HTTP {r.status_code})')

          print('Taille du fichier reçu :', len(r.content), 'octets')

          # Extraction en mémoire
          with zipfile.ZipFile(io.BytesIO(r.content)) as z:
              z.extractall('work')

          csv_files = glob.glob('work/*.csv')
          if not csv_files:
              raise FileNotFoundError('Aucun fichier CSV extrait de l\'archive.')

          print(f'Traitement du CSV : {csv_files[0]}')

          # Lecture du CSV avec encodage tolérant
          try:
              df = pd.read_csv(csv_files[0], sep=';', encoding='utf-8', low_memory=False)
          except:
              df = pd.read_csv(csv_files[0], sep=';', encoding='iso-8859-1', low_memory=False)

          # Nettoyage et tri décroissant par date de tirage
          date_cols = [c for c in df.columns if 'date_de_tirage' in c.lower()]
          if date_cols:
              df['dt_temp'] = pd.to_datetime(df[date_cols[0]], format='%d/%m/%Y', errors='coerce')
              df = df.sort_values(by='dt_temp', ascending=False)
              df = df.drop(columns=['dt_temp'])

          # Enregistrement dans la racine
          df.to_csv('loto.csv', sep=';', index=False)
          print('OK : loto.csv mis à jour avec succès depuis l\'API FDJ !')
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add loto.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update loto.csv from FDJ API" && git push)
