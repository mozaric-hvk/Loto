name: Mise à jour automatique des tirages Loto

on:
  schedule:
    # S'exécute automatiquement du lundi au samedi à 22h30 UTC
    - cron: '30 22 * * 1,3,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Télécharger le dernier CSV
        run: |
          curl -f -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://www.statistiques-loto.fr/csv/loto_201911.csv" -o loto.csv || \
          curl -f -s -L -A "Mozilla/5.0" "https://files.data.gouv.fr/fdj/loto/loto_201911.csv" -o loto.csv

      - name: Sauvegarder les modifications
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add loto.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour auto du fichier loto.csv" && git push)
