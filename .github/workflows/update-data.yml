name: Update Loto Data

on:
  schedule:
    # S'exécute les mardis, mercredis et samedis soirs après les tirages (vers 23h UTC)
    - cron: '0 23 * * 1,3,6'
  workflow_dispatch: # Permet le lancement manuel depuis GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Download latest FDJ Loto Zip & process loto.csv
        run: |
          import requests
          from bs4 import BeautifulSoup
          import re
          import zipfile
          import glob
          import os
          import pandas as pd

          # 1. Scraping de la page Open Data FDJ pour trouver le lien du zip actuel
          page_url = "https://www.fdj.fr/jeux-de-tirage/loto/resultats/historique"
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          
          print("Recherche du lien ZIP le plus récent...")
          res = requests.get(page_url, headers=headers)
          
          zip_url = None
          # Recherche d'un lien .zip contenant loto dans l'URL
          if res.status_code == 200:
              soup = BeautifulSoup(res.text, 'html.parser')
              for a in soup.find_all('a', href=True):
                  if 'loto' in a['href'].lower() and a['href'].endswith('.zip'):
                      zip_url = a['href']
                      if not zip_url.startswith('http'):
                          zip_url = 'https://www.fdj.fr' + zip_url
                      break

          # Fallback sur l'API data.gouv.fr si la FDJ bloque le scraping direct
          if not zip_url:
              print("Fallback sur data.gouv.fr...")
              api_url = "https://www.data.gouv.fr/api/1/datasets/5379f612a3a72921b795267b/"
              r = requests.get(api_url)
              if r.status_code == 200:
                  resources = r.json().get('resources', [])
                  for res_item in resources:
                      if res_item.get('format') == 'zip' or 'loto' in res_item.get('title', '').lower():
                          zip_url = res_item.get('url')
                          break

          print(f"Téléchargement depuis : {zip_url}")
          
          # 2. Téléchargement et extraction du ZIP
          zip_req = requests.get(zip_url, headers=headers)
          with open("latest_loto.zip", "wb") as f:
              f.write(zip_req.content)

          with zipfile.ZipFile("latest_loto.zip", 'r') as zip_ref:
              zip_ref.extractall("extracted_data")

          # 3. Conversion et tri avec Pandas
          csv_files = glob.glob("extracted_data/*.csv")
          if csv_files:
              # Lecture du CSV avec gestion des encodages courants FDJ
              try:
                  df = pd.read_csv(csv_files[0], sep=';', encoding='utf-8', low_memory=False)
              except:
                  df = pd.read_csv(csv_files[0], sep=';', encoding='iso-8859-1', low_memory=False)

              # Recherche de la colonne date
              date_col = None
              for col in df.columns:
                  if 'date_de_tirage' in col.lower():
                      date_col = col
                      break
              
              if date_col:
                  df['parsed_date'] = pd.to_datetime(df[date_col], format='%d/%m/%Y', errors='coerce')
                  df = df.sort_values(by='parsed_date', ascending=False)
                  df = df.drop(columns=['parsed_date'])

              # Sauvegarde sous loto.csv
              df.to_csv('loto.csv', sep=';', index=False)
              print("Fichier loto.csv mis à jour avec succès !")

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add loto.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update loto.csv with latest draws" && git push)
