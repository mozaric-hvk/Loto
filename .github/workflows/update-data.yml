name: Mise à jour automatique des tirages Loto

on:
  schedule:
    # S'exécute automatiquement du lundi au samedi à 22h30 UTC
    - cron: '30 22 * * 1,3,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Télécharger et dézipper le CSV officiel FDJ
        run: |
          python -c "
          import urllib.request
          import zipfile
          import io

          # URL directe du serveur CDN FDJ
          url = 'https://media.fdj.fr/static-draws/csv/loto/loto_201911.zip'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})

          with urllib.request.urlopen(req) as response:
              zip_bytes = response.read()

          with zipfile.ZipFile(io.BytesIO(zip_bytes)) as z:
              # Récupère le fichier CSV contenu dans le ZIP
              csv_filename = [f for f in z.namelist() if f.endswith('.csv')][0]
              with z.open(csv_filename) as f_in, open('loto.csv', 'wb') as f_out:
                  f_out.write(f_in.read())

          print('Fichier loto.csv mis à jour avec succès !')
          "

      - name: Sauvegarder les modifications
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add loto.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour auto du fichier loto.csv" && git push)
