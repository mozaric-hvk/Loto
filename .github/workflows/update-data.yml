name: Update Loto Data

on:
  schedule:
    - cron: '0 23 * * 1,3,6'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract Loto ZIP
        run: |
          mkdir -p work
          cd work
          curl -sL "https://www.data.gouv.fr/fr/datasets/r/5902129a-773a-441e-a4e5-4767119f9e7b" -o loto.zip
          unzip -o loto.zip

      - name: Process CSV with Python
        run: |
          python3 -c "
          import glob, os, pandas as pd

          csv_files = glob.glob('work/*.csv')
          if csv_files:
              try:
                  df = pd.read_csv(csv_files[0], sep=';', encoding='utf-8', low_memory=False)
              except:
                  df = pd.read_csv(csv_files[0], sep=';', encoding='iso-8859-1', low_memory=False)

              # Recherche de la colonne date
              date_cols = [c for c in df.columns if 'date_de_tirage' in c.lower()]
              if date_cols:
                  df['dt_temp'] = pd.to_datetime(df[date_cols[0]], format='%d/%m/%Y', errors='coerce')
                  df = df.sort_values(by='dt_temp', ascending=False)
                  df = df.drop(columns=['dt_temp'])

              df.to_csv('loto.csv', sep=';', index=False)
              print('OK: loto.csv généré avec succès')
          else:
              print('Erreur: Aucun fichier CSV trouvé')
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add loto.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update loto.csv" && git push)
